name: "Build Merged EPG"

on:
  schedule:
    # ogni giorno alle 04:30 UTC (06:30 italiane)
    - cron: '30 4 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/build_epg.py'
      - '.github/workflows/build-epg.yml'
      - 'iptvitaplus.m3u'

concurrency:
  group: build-epg
  cancel-in-progress: true

jobs:
  build-epg:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configurazione ambiente Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Genera EPG unito (epgitalia + open-epg)
        env:
          PYTHONUNBUFFERED: "1"
        run: python scripts/build_epg.py

      - name: Pubblica l'EPG come asset di release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Nessun commit: l'asset viene sovrascritto a ogni esecuzione.
          gh release view epg >/dev/null 2>&1 || \
            gh release create epg --target main \
              --title "EPG aggiornato" \
              --notes "Asset epg.xml.gz rigenerato automaticamente ogni giorno (epgitalia + open-epg)."
          gh release upload epg epg.xml.gz --clobber

      - name: Verifica URL pubblico
        run: |
          URL="https://github.com/pasq96/IPTV-Italia/releases/download/epg/epg.xml.gz"
          curl -fsSL --retry 3 --max-time 60 "$URL" -o /tmp/check.gz
          gzip -t /tmp/check.gz
          echo "Asset raggiungibile e gzip valido: $URL"
