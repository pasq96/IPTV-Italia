name: "Update Sky Stream Tokens (iptvitaplus.m3u)"

on:
  schedule:
    # Esecuzione automatica ogni 12 ore (alle 00:00 e 12:00 UTC)
    - cron: '0 */12 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: "Motivo dell'esecuzione manuale"
        required: false
        default: "Aggiornamento manuale token Akamai"

jobs:
  refresh-tokens:
    name: "Refresh Akamai Tokens"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v5

      - name: "Configurazione ambiente Python"
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: "Esecuzione script estrazione token Sky"
        run: python .github/scripts/.update_sky.py

      - name: "Verifica e Commit delle modifiche a iptvitaplus.m3u"
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add iptvitaplus.m3u
          if git diff --staged --quiet; then
            echo "Nessuna modifica rilevata nei token. File iptvitaplus.m3u già aggiornato."
          else
            echo "Nuovi token rilevati. In corso il commit ed il push..."
            git commit -m "auto(sky): update Akamai hdnts tokens in iptvitaplus.m3u [skip ci]"
            git push
          fi