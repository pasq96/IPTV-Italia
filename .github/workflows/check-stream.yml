name: "Check IPTV Streams and Refresh Tokens"

on:
  push:
    branches:
      - main
    paths:
      - 'iptvitaplus.m3u'
  schedule:
    - cron: '0 */12 * * *' 
  workflow_dispatch:

# Evita che due esecuzioni dello stesso workflow si sovrappongano
concurrency:
  group: check-stream
  cancel-in-progress: false

jobs:
  check-and-refresh:
    runs-on: ubuntu-24.04
    env:
      NODE_OPTIONS: "--no-deprecation"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configurazione ambiente Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Cache dei pacchetti APT per ffmpeg
        id: cache-ffmpeg
        uses: actions/cache@v6
        with:
          path: .apt-cache
          key: ${{ runner.os }}-apt-ffmpeg-v1

      - name: Installa ffmpeg e ffprobe
        run: |
          mkdir -p .apt-cache
          sudo apt-get update
          sudo apt-get install -y -o Dir::Cache::Archives="$PWD/.apt-cache" ffmpeg
          # Rimuove i file protetti da root (lock e partial) e cambia la proprietà dei .deb all'utente runner
          sudo rm -rf .apt-cache/lock .apt-cache/partial
          sudo chown -R $USER:$USER .apt-cache

      - name: Esecuzione script di verifica e update
        env:
          PYTHONUNBUFFERED: "1"
        run: python .github/scripts/check_and_update.py

      - name: Commit e Push delle modifiche
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add status.json iptvitaplus.m3u
          if git diff --staged --quiet; then
            echo "Nessun aggiornamento necessario."
          else
            git commit -m "auto: update stream status and refreshed tokens [skip ci]"
            # Il workflow Build Merged EPG può pushare in parallelo: riallinea
            # e ritenta il push invece di fallire per "fetch first".
            for attempt in 1 2 3; do
              if git pull --rebase --autostash origin main; then
                if git push origin main; then
                  echo "Push riuscito (tentativo $attempt)."
                  exit 0
                fi
              else
                git rebase --abort 2>/dev/null || true
              fi
              echo "Push rifiutato, riprovo ($attempt/3)..."
              sleep 5
            done
            echo "::error::Impossibile pushare dopo 3 tentativi."
            exit 1
          fi
