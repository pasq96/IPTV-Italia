name: "Build Merged EPG"

on:
  schedule:
    # ogni giorno alle 04:30 UTC (06:30 italiane)
    - cron: '30 4 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/build_epg.py'
      - '.github/workflows/build-epg.yml'
      - 'iptvitaplus.m3u'

concurrency:
  group: build-epg
  cancel-in-progress: true

jobs:
  build-epg:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configurazione ambiente Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Genera EPG unito (epgitalia + open-epg)
        env:
          PYTHONUNBUFFERED: "1"
        run: python scripts/build_epg.py

      - name: Commit e Push dell'EPG aggiornato
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add epg.xml.gz
          if git diff --staged --quiet; then
            echo "Nessun aggiornamento EPG necessario."
          else
            git commit -m "auto: rebuild merged EPG [skip ci]"
            # Il workflow Check Streams può pushare in parallelo: riallinea
            # e ritenta il push invece di fallire per "fetch first".
            for attempt in 1 2 3; do
              if git pull --rebase --autostash origin main; then
                if git push origin main; then
                  echo "Push riuscito (tentativo $attempt)."
                  exit 0
                fi
              else
                git rebase --abort 2>/dev/null || true
              fi
              echo "Push rifiutato, riprovo ($attempt/3)..."
              sleep 5
            done
            echo "::error::Impossibile pushare dopo 3 tentativi."
            exit 1
          fi
