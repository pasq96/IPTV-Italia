name: "Check IPTV Streams and Refresh Tokens"

on:
  push:
    branches:
      - main
    paths:
      - 'iptvitaplus.m3u'
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  check-and-refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configurazione ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa ffmpeg e ffprobe
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Esecuzione script di verifica e update
        run: python .github/scripts/check_and_update.py

      - name: Commit e Push delle modifiche
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add status.json
          if git diff --staged --quiet; then
            echo "Nessun aggiornamento necessario."
          else
            git commit -m "chore(status): update channel status report [skip ci]"
            git push
          fi