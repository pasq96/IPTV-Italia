name: "Release IPTV Playlist"

on:
  push:
    branches:
      - main
    paths:
      - 'iptvitaplus.m3u'

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Release Tag
        id: vars
        run: echo "TAG_NAME=v$(date +'\%Y.\%m.\%d-\%H\%M')" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "IPTV Italia Plus - ${{ env.TAG_NAME }}"
          body: "Release automatica aggiornata della playlist `iptvitaplus.m3u`."
          draft: false
          prerelease: false
          files: |
            iptvitaplus.m3u
            status.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
