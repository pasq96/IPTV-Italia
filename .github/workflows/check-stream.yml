name: "Stream Health Check (manuale)"

# Nessuna schedulazione: si lancia solo a mano da Actions.
# Non fa commit: il report e l'eventuale playlist aggiornata finiscono
# come artifact del run.
on:
  workflow_dispatch:

concurrency:
  group: check-stream
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      NODE_OPTIONS: "--no-deprecation"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configurazione ambiente Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Cache dei pacchetti APT per ffmpeg
        id: cache-ffmpeg
        uses: actions/cache@v6
        with:
          path: .apt-cache
          key: ${{ runner.os }}-apt-ffmpeg-v1

      - name: Installa ffmpeg e ffprobe
        run: |
          mkdir -p .apt-cache
          sudo apt-get update
          sudo apt-get install -y -o Dir::Cache::Archives="$PWD/.apt-cache" ffmpeg
          sudo rm -rf .apt-cache/lock .apt-cache/partial
          sudo chown -R $USER:$USER .apt-cache

      - name: Esecuzione script di verifica
        env:
          PYTHONUNBUFFERED: "1"
        run: python .github/scripts/check_and_update.py

      - name: Salva report e playlist come artifact
        uses: actions/upload-artifact@v7
        with:
          name: stream-check
          path: |
            status.json
            iptvitaplus.m3u
          if-no-files-found: warn
