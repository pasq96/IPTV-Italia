name: "Check IPTV Streams and Refresh Tokens"

on:
  schedule:
    - cron: '0 */6 * * *'  # Esecuzione ogni 6 ore
  workflow_dispatch:

jobs:
  check-and-refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configurazione ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Esecuzione script di verifica e update
        run: python .github/scripts/check_and_update.py

      - name: Commit e Push delle modifiche
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add iptvitaplus.m3u status.json
          if git diff --staged --quiet; then
            echo "Nessun aggiornamento necessario."
          else
            git commit -m "auto: update stream status and refreshed tokens [skip ci]"
            git push
          fi
